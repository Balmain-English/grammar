<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safety Signs — Grammar Test (A2)</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background: #f5f5f2; color: #1a1a1a; padding: 24px 16px; }
  .wrap { max-width: 680px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: #555; }
  .q-block { background: #fff; border: 1px solid #e0e0de; border-radius: 10px; padding: 16px 20px; margin-bottom: 14px; }
  .q-num { font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  .sign-tag { display: inline-block; background: #f0ede8; border: 1px solid #d6d3ce; border-radius: 6px; font-size: 12px; font-weight: 600; color: #555; padding: 2px 10px; margin-bottom: 10px; }
  .q-text { font-size: 15px; line-height: 1.6; margin-bottom: 12px; }
  .mc-options { display: flex; flex-direction: column; gap: 8px; }
  .mc-btn { background: #f5f5f2; border: 1px solid #d6d3ce; border-radius: 8px; padding: 9px 14px; font-size: 14px; cursor: pointer; text-align: left; color: #1a1a1a; transition: background .12s, border-color .12s; }
  .mc-btn:hover:not(:disabled) { background: #eae8e3; }
  .mc-btn.correct { background: #eaf3de; border-color: #5a9020; color: #2e5810; font-weight: 600; }
  .mc-btn.wrong { background: #fcebeb; border-color: #c03030; color: #7a1f1f; }
  .mc-btn.reveal { background: #eaf3de; border-color: #5a9020; color: #2e5810; }
  .gap-sentence { font-size: 15px; line-height: 2.2; }
  .gap-input { border: none; border-bottom: 2px solid #888; background: transparent; font-size: 15px; font-family: inherit; color: #1a1a1a; padding: 0 4px; width: 120px; outline: none; }
  .gap-input:focus { border-bottom-color: #2266cc; }
  .gap-input.correct { border-bottom-color: #5a9020; color: #2e5810; font-weight: 600; }
  .gap-input.wrong { border-bottom-color: #c03030; color: #c03030; }
  .feedback { font-size: 13px; margin-top: 8px; min-height: 18px; }
  .feedback.ok { color: #2e5810; }
  .feedback.err { color: #7a1f1f; }
  .actions { text-align: center; margin-top: 24px; }
  .submit-btn { background: #1a1a1a; color: #fff; border: none; border-radius: 8px; padding: 12px 36px; font-size: 15px; cursor: pointer; font-family: inherit; }
  .submit-btn:hover { background: #333; }
  .score-card { margin-top: 24px; background: #fff; border: 1px solid #e0e0de; border-radius: 10px; padding: 28px; text-align: center; }
  .score-big { font-size: 40px; font-weight: 700; }
  .score-msg { font-size: 15px; color: #555; margin-top: 6px; }
  .retry-btn { margin-top: 16px; background: transparent; border: 1px solid #d6d3ce; border-radius: 8px; padding: 9px 24px; font-size: 14px; cursor: pointer; font-family: inherit; color: #333; }
  .retry-btn:hover { background: #f0ede8; }
  .inst { font-size: 13px; color: #555; font-style: italic; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Safety signs — grammar test</h1>
    <p class="subtitle">Use <strong>must</strong>, <strong>mustn't</strong>, <strong>can't</strong>, and <strong>don't have to</strong> correctly &nbsp;·&nbsp; A2 level &nbsp;·&nbsp; 12 questions</p>
  </header>
  <div id="quiz"></div>
  <div class="actions"><button class="submit-btn" id="submitBtn" onclick="submitAll()">Check all answers</button></div>
  <div id="scoreCard"></div>
</div>

<script>
const Qs = [
  { type:"mc", sign:"Danger — demolition work in progress",
    text:'Workers _____ wear a hard hat on this site. It\'s compulsory.',
    options:["must","mustn't","don't have to","can't"], answer:0 },
  { type:"mc", sign:"No smoking",
    text:"You _____ smoke here. It is strictly forbidden.",
    options:["must","can't","don't have to","should"], answer:1 },
  { type:"mc", sign:"Head protection must be worn",
    text:"You _____ enter this area without a hard hat.",
    options:["must","don't have to","mustn't","can't"], answer:2 },
  { type:"mc", sign:"Foot protection must be worn",
    text:"On this site, workers _____ wear safety boots at all times.",
    options:["don't have to","mustn't","can't","must"], answer:3 },
  { type:"mc", sign:"Fire extinguisher",
    text:"You _____ use this extinguisher for cooking. That is very dangerous.",
    options:["must","don't have to","mustn't","can't"], answer:2 },
  { type:"mc", sign:"Notice — all visitors report to site office",
    text:"Visitors _____ go straight onto the site. They need to check in first.",
    options:["must","mustn't","don't have to","can't"], answer:1 },
  { type:"gap", sign:"Safety goggles must be worn",
    inst:"Complete the sentence. Use <em>must</em> or <em>mustn't</em>.",
    before:"You", after:"wear safety goggles in this area. It is a rule.", answer:"must" },
  { type:"gap", sign:"Hearing protection must be worn",
    inst:"Complete the sentence. Use <em>must</em> or <em>mustn't</em>.",
    before:"Workers", after:"enter the factory floor without ear defenders.", answer:"mustn't" },
  { type:"gap", sign:"First aid",
    inst:"Complete the sentence. Use <em>don't have to</em> or <em>must</em>.",
    before:"You", after:"be a doctor to use the first aid kit, but you should be careful.", answer:"don't have to" },
  { type:"gap", sign:"Hazchem",
    inst:"Complete the sentence. Use <em>can't</em> or <em>don't have to</em>.",
    before:"Untrained people", after:"handle these chemicals. It is not allowed.", answer:"can't" },
  { type:"gap", sign:"Forklifts in use",
    inst:"Complete the sentence. Use <em>mustn't</em> or <em>don't have to</em>.",
    before:"Pedestrians", after:"walk in the forklift zone. It is very dangerous.", answer:"mustn't" },
  { type:"gap", sign:"Flammable liquid — dangerous goods",
    inst:"Complete the sentence. Use <em>mustn't</em> or <em>don't have to</em>.",
    before:"You", after:"store these goods near a heat source. They can catch fire.", answer:"mustn't" }
];

let sel = {}, done = false;

function build() {
  const quiz = document.getElementById("quiz");
  quiz.innerHTML = "";
  Qs.forEach((q, i) => {
    const d = document.createElement("div");
    d.className = "q-block"; d.id = "q"+i;
    d.innerHTML = `<div class="q-num">Question ${i+1} of ${Qs.length}</div><div class="sign-tag">Sign: ${q.sign}</div>`;
    if (q.type === "mc") {
      d.innerHTML += `<div class="q-text">${q.text}</div><div class="mc-options" id="opts${i}"></div><div class="feedback" id="fb${i}"></div>`;
      quiz.appendChild(d);
      const wrap = document.getElementById("opts"+i);
      q.options.forEach((opt, j) => {
        const b = document.createElement("button");
        b.className = "mc-btn"; b.textContent = opt; b.dataset.j = j;
        b.onclick = () => { if(!done){ sel[i]=j; wrap.querySelectorAll(".mc-btn").forEach(x=>x.style.fontWeight="400"); b.style.fontWeight="700"; } };
        wrap.appendChild(b);
      });
    } else {
      d.innerHTML += `<div class="inst">${q.inst}</div><div class="gap-sentence">${q.before} <input class="gap-input" id="gap${i}" type="text" placeholder="…" autocomplete="off"> ${q.after}</div><div class="feedback" id="fb${i}"></div>`;
      quiz.appendChild(d);
      document.getElementById("gap"+i).oninput = e => { sel[i] = e.target.value.trim(); };
    }
  });
}

function submitAll() {
  if (done) return;
  done = true;
  document.getElementById("submitBtn").disabled = true;
  document.getElementById("submitBtn").style.opacity = "0.5";
  let score = 0;
  Qs.forEach((q, i) => {
    const fb = document.getElementById("fb"+i);
    if (q.type === "mc") {
      const chosen = sel[i];
      document.getElementById("opts"+i).querySelectorAll(".mc-btn").forEach((b, j) => {
        b.disabled = true;
        if (j === q.answer) b.classList.add("reveal");
        if (chosen !== undefined && j === chosen && j !== q.answer) b.classList.add("wrong");
      });
      if (chosen === q.answer) { score++; fb.className="feedback ok"; fb.textContent="Correct!"; }
      else if (chosen === undefined) { fb.className="feedback err"; fb.textContent=`Not answered. Correct answer: ${q.options[q.answer]}`; }
      else { fb.className="feedback err"; fb.textContent=`Not quite. Correct answer: ${q.options[q.answer]}`; }
    } else {
      const inp = document.getElementById("gap"+i);
      inp.disabled = true;
      const val = (inp.value||"").trim().toLowerCase();
      if (val === q.answer.toLowerCase()) {
        score++; inp.classList.add("correct");
        fb.className="feedback ok"; fb.textContent="Correct!";
      } else {
        inp.classList.add("wrong");
        fb.className="feedback err"; fb.textContent=`Not quite. Correct answer: "${q.answer}"`;
      }
    }
  });
  const pct = Math.round(score/Qs.length*100);
  const msg = pct>=80?"Excellent work! Well done.":pct>=50?"Good effort — keep practising!":"Keep going — you'll improve!";
  document.getElementById("scoreCard").innerHTML = `<div class="score-card"><div class="score-big">${score} / ${Qs.length}</div><div class="score-msg">${pct}% &nbsp;·&nbsp; ${msg}</div><button class="retry-btn" onclick="reset()">Try again</button></div>`;
  document.getElementById("scoreCard").scrollIntoView({behavior:"smooth"});
}

function reset() {
  sel = {}; done = false;
  document.getElementById("scoreCard").innerHTML = "";
  document.getElementById("submitBtn").disabled = false;
  document.getElementById("submitBtn").style.opacity = "1";
  build();
  window.scrollTo({top:0,behavior:"smooth"});
}

build();
</script>
</body>
</html>
